name: build-stub-launcher

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest sudah membawa Android SDK di /usr/local/lib/android/sdk.
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)"
          [[ -n "$SDKMANAGER" ]] || { echo "sdkmanager tidak ditemukan" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build stub launcher
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./scripts/build_launcher.sh

      - name: Upload stub APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-recompile-launcher-stub
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
